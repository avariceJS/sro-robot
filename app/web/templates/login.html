{% extends "base.html" %}
{% block title %}Вход — СРО-робот{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div class="panel" style="max-width: 22rem; margin: 2rem auto;">
  <h1 style="margin: 0 0 1rem; font-size: 1.25rem;">Вход</h1>
  {% if error %}
  <p class="msg-error">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('login_submit') }}">
    <p>
      <label for="login">Логин СРОАрбитр</label><br>
      <input
        type="text"
        id="login"
        name="login"
        required
        autofocus
        autocomplete="username"
        placeholder="Логин от СРОАрбитр"
        value="{{ login|default('', true) }}"
      >
    </p>
    <p>
      <label for="password">Пароль СРОАрбитр</label><br>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </p>
    <button type="submit" class="btn-primary">Войти</button>
  </form>
</div>
{% endblock %}
