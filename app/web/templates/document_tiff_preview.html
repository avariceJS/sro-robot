<div class="tiff-preview" data-tiff-preview data-preview-url="{{ tiff_preview_url }}">
  <div class="tiff-page-tools" role="group" aria-label="Страницы документа">
    <button type="button" data-tiff-page-step="-1" disabled>Предыдущая</button>
    <span data-tiff-page-label role="status" aria-live="polite">Загрузка страницы…</span>
    <button type="button" data-tiff-page-step="1" disabled>Следующая</button>
  </div>
  {% set image_preview_alt = 'Страница исходного TIFF-документа' %}
  {% include 'document_image_preview.html' %}
  <p class="field-warning" data-tiff-page-notice role="status" hidden></p>
</div>
