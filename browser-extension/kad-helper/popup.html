<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Помощник КАД</title>
<body style="font:14px system-ui,sans-serif;min-width:280px;margin:0;padding:18px;color:#172033"><p style="margin:0;color:#2457a7;font-weight:700">СРО Робот</p><h1 style="font-size:19px;margin:6px 0 8px">Помощник КАД</h1>
<p style="line-height:1.5;color:#475569">Поиск начинается на странице документов. Выберите документ в видимой хронологии; PDF будет передан на офисный сервер для проверки и OCR.</p>
<p id="status" role="status" aria-live="polite" style="padding:10px;background:#f1f5f9;border-radius:8px;line-height:1.45">Проверяем разрешение браузера для передачи PDF…</p>
<button id="open-office" type="button" style="width:100%;padding:10px;border:0;border-radius:8px;background:#2457a7;color:white;font-weight:700;cursor:pointer">Открыть СРО Робот</button>
<button id="enable-pdf" type="button" style="display:none;width:100%;margin-top:8px;padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#172033">Разрешить передачу PDF</button>
<script src="popup.js"></script></body></html>
