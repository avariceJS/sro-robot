<!doctype html><html lang="ru"><meta charset="utf-8"><title>Помощник КАД</title>
<body><h2>Найти дело в КАД</h2>
<form id="search"><label>Номер дела <input id="case" required placeholder="А99-12345/2099" maxlength="64"></label><p><label>Дата судебного акта <input id="act-date" type="date"></label><br><small>Дата на самом документе, не дата публикации. Дату можно не указывать.</small></p><p><button>Найти и открыть</button></p></form>
<p id="status" role="status">Дело и единственный найденный PDF открываются автоматически.</p>
<p><button id="enable-pdf" type="button">Включить передачу PDF в Firefox</button></p>
<script src="protocol.js"></script><script src="popup.js"></script></body></html>
