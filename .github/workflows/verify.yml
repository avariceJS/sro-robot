name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SRO_DRILL_TASKS: "100000"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install hash-locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-bootstrap.txt
          .venv/bin/python -m pip install --require-hashes -r requirements.txt

      - name: Install verification system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Audit installed Python environment
        run: |
          .venv/bin/python -m pip install --require-hashes -r requirements-audit.txt
          .venv/bin/python -m pip_audit --local --vulnerability-service pypi

      - name: Run local verification suite
        run: scripts/dev/verify.sh
