name: Deploy production release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag already published on main (sro-vX.Y.Z)
        required: true
        type: string
      confirm_deploy:
        description: Explicitly confirm deployment to sro-office.ru
        required: true
        type: choice
        options:
          - no
          - deploy
        default: no

permissions:
  contents: read

concurrency:
  group: sro-office-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'deploy'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    env:
      SRO_ROBOT_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - name: Check out main and validate release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate annotated tag is on main
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^sro-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --quiet origin main --tags
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]]
          commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          [[ "$commit" == "$(git rev-parse origin/main)" ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install pinned verification dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-bootstrap.txt
          .venv/bin/python -m pip install --require-hashes -r requirements.txt
          .venv/bin/python -m pip install --require-hashes -r requirements-test.txt

      - name: Install verification system tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Verify the exact release commit
        run: scripts/dev/verify.sh

      - name: Prepare pinned VPS SSH access
        env:
          VPS_DEPLOY_KEY: ${{ secrets.SRO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_DEPLOY_KEY"
          umask 077
          key_path="$RUNNER_TEMP/sro-vps-key"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$key_path"
          printf 'SRO_VPS_SSH_KEY=%s\n' "$key_path" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ssh"
          install -m 0600 deploy/cloud/sro-office_known_hosts "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -F 'SHA256:waebQvkyPJUAjcQ30bK3FnHViZ0vckSoN4YdoizBF1w'

      - name: Deploy the tagged release with backup and rollback guards
        env:
          SRO_VPS_HOST: ${{ vars.SRO_VPS_HOST }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/ops/deploy_vps.sh "$RELEASE_TAG"
